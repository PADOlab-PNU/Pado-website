<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Notion 다크/라이트 모드 양쪽에서 iframe 배경이 투명하게 유지되도록 -->
  <meta name="color-scheme" content="light dark">
  <title>Interactive World Map - PADO Lab</title>
  <style>
    html, body {
      background: transparent;
    }

    body {
      font-family: 'Pretendard', -apple-system, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 16px;
    }

    h2 {
      margin: 0 0 15px;
      font-weight: 600;
      color: #0ea5e9; /* 라이트/다크 배경 모두에서 읽히는 하늘색 */
    }

    /* 1. Map Container */
    .map-container {
      position: relative;
      max-width: 1000px;
      width: 100%;
      container-type: inline-size; /* 지도 크기에 맞춰 버튼 글자 크기 조절 */
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      border-radius: 12px;
      overflow: hidden;
      user-select: none;
    }

    .map-image {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 2. Pill(트랙 모양) 버튼 */
    .pin {
      --tx: -50%; /* 기본: 좌표가 버튼 가운데 */
      position: absolute;
      display: flex;
      align-items: center;
      gap: 0.5em;
      padding: 0.35em 0.9em 0.35em 0.6em;
      font-size: clamp(9px, 1.3cqw, 13px);
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
      color: #ffffff;
      background: rgba(15, 23, 42, 0.78);
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      border-radius: 999px;
      cursor: pointer;
      transform: translate(var(--tx), -50%);
      z-index: 10;
      transition: background-color 0.2s, color 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    /* 좌표가 버튼의 왼쪽 끝 (버튼이 오른쪽으로 펼쳐짐) */
    .pin[data-anchor="left"]  { --tx: 0%; }
    /* 좌표가 버튼의 오른쪽 끝 (버튼이 왼쪽으로 펼쳐짐) */
    .pin[data-anchor="right"] { --tx: -100%; flex-direction: row-reverse; padding: 0.35em 0.6em 0.35em 0.9em; }

    /* 버튼 안의 작은 점: 정확한 위치 표시 */
    .pin::before {
      content: '';
      flex: none;
      width: 0.6em;
      height: 0.6em;
      border-radius: 50%;
      background: #ff4757;
      transition: background-color 0.2s;
    }

    /* 마우스 오버 / 키보드 포커스 시 하이라이트 */
    .pin:hover,
    .pin:focus-visible {
      background: #ff4757;
      border-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(255, 71, 87, 0.35), 0 4px 12px rgba(0, 0, 0, 0.4);
      outline: none;
      z-index: 20;
    }

    .pin:hover::before,
    .pin:focus-visible::before {
      background: #ffffff;
    }

    /* 3. Info Tooltip */
    #tooltip {
      position: fixed;
      display: none;
      background: rgba(15, 23, 42, 0.95);
      color: #ffffff;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      pointer-events: none;
      border: 1px solid #ff4757;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
      z-index: 1000;
      line-height: 1.6;
      max-width: 250px;
    }

    #tooltip strong {
      color: #ff4757;
      font-size: 15px;
      display: block;
      margin-bottom: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 4px;
    }

    .link-hint {
      display: block;
      margin-top: 6px;
      font-size: 11px;
      color: #38bdf8;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <h2>📍 PADO Lab. Research Area</h2>

  <div class="map-container">
    <img src="https://nmssanctuaries.blob.core.windows.net/sanctuaries-prod/media/archive/library/gis-header.jpg" alt="World Map" class="map-image">

    <!--
      =================================================================================
      [ 버튼 설정 ]
      - style="left/top"  : 좌표 (%)
      - data-anchor       : 좌표 기준 버튼이 펼쳐지는 방향
                            left  = 좌표에서 오른쪽으로 펼쳐짐
                            right = 좌표에서 왼쪽으로 펼쳐짐
                            (생략) = 좌표가 버튼 가운데
      - 버튼 안 텍스트      : 지도에 보이는 해역명
      - data-url          : 클릭 시 열릴 Notion 페이지
      =================================================================================
    -->

    <!-- 1. Chukchi Borderland (Arctic) -->
    <div class="pin" tabindex="0" role="link"
         style="left: 5%; top: 7%;"
         data-anchor="left"
         data-title="Chukchi Borderland (Arctic)"
         data-info="Equipment <br>Brief Research Content"
         data-pos="bottom-right"
         data-url="https://app.notion.com/p/pnupado/Arctic-Ocean-Observation-3d9852a8a90a80b1bcdffcf91a42da51">Chukchi Borderland</div>

    <!-- 2. East Sea -->
    <div class="pin" tabindex="0" role="link"
         style="left: 84%; top: 29%;"
         data-anchor="right"
         data-title="East Sea"
         data-info="Equipment <br>Brief Research Content"
         data-url="https://app.notion.com/p/pnupado/Lagrangian-Analysis-3d9852a8a90a8016a733c907666f6084">East Sea</div>

    <!-- 3. Kuroshio Current -->
    <div class="pin" tabindex="0" role="link"
         style="left: 89%; top: 30%;"
         data-anchor="left"
         data-title="Kuroshio Current"
         data-info="Equipment <br>Brief Research Content"
         data-url="https://app.notion.com/p/pnupado/Kuroshio-current-Observation-3d9852a8a90a806f98fceedfe849fa63">Kuroshio</div>

    <!-- 4. Northwestern Pacific -->
    <div class="pin" tabindex="0" role="link"
         style="left: 83%; top: 40%;"
         data-anchor="left"
         data-title="Northwestern Pacific"
         data-info="Equipment <br>Brief Research Content"
         data-url="https://app.notion.com/p/pnupado/Northwestern-Pacific-Observation-3d9852a8a90a8002abbcd9477fa53c4f">NW Pacific</div>

  </div>

  <div id="tooltip"></div>

  <script>
    const tooltip = document.getElementById('tooltip');
    const pins = document.querySelectorAll('.pin');

    function openPin(pin) {
      const url = pin.getAttribute('data-url');
      if (url && !url.includes('YOUR_URL_HERE')) {
        window.open(url, '_blank');
      }
    }

    pins.forEach(pin => {
      // 클릭 / Enter 키로 새 탭 열기
      pin.addEventListener('click', () => openPin(pin));
      pin.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openPin(pin);
        }
      });

      // 마우스 오버 시 툴팁
      pin.addEventListener('mousemove', (e) => {
        const title = pin.getAttribute('data-title');
        const info = pin.getAttribute('data-info');
        const url = pin.getAttribute('data-url');
        const pos = pin.getAttribute('data-pos') || 'bottom-left';

        let hintHtml = '';
        if (url && !url.includes('YOUR_URL_HERE')) {
          hintHtml = `<span class="link-hint">🔗 Click to open document</span>`;
        }

        tooltip.innerHTML = `<strong>${title}</strong>${info}${hintHtml}`;
        tooltip.style.display = 'block';

        if (pos === 'top-right') {
          tooltip.style.left = (e.clientX + 15) + 'px';
          tooltip.style.top = (e.clientY - 15) + 'px';
          tooltip.style.transform = 'translateY(-100%)';
        } else if (pos === 'bottom-right') {
          tooltip.style.left = (e.clientX + 15) + 'px';
          tooltip.style.top = (e.clientY + 15) + 'px';
          tooltip.style.transform = 'none';
        } else {
          tooltip.style.left = (e.clientX - 15) + 'px';
          tooltip.style.top = (e.clientY + 15) + 'px';
          tooltip.style.transform = 'translateX(-100%)';
        }
      });

      pin.addEventListener('mouseleave', () => {
        tooltip.style.display = 'none';
      });
    });
  </script>

</body>
</html>
