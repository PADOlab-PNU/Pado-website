<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Notion 다크/라이트 모드 양쪽에서 iframe 배경이 투명하게 유지되도록 -->
  <meta name="color-scheme" content="light dark">
  <title>Interactive Map - PADO Lab</title>
  <style>
    html, body {
      background: transparent;
    }

    body {
      font-family: 'Pretendard', -apple-system, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 16px;
    }

    h2 {
      margin: 0 0 15px;
      font-weight: 600;
      color: #0ea5e9;
    }

    /* 1. Map Container */
    .map-container {
      position: relative;
      max-width: 1000px;
      width: 100%;
      container-type: inline-size;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      border-radius: 12px;
      overflow: hidden;
      user-select: none;
    }

    .map-image {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 2. 버튼 공통 */
    .pin {
      position: absolute;
      cursor: pointer;
      z-index: 10;
      outline: none;
      /* 기본: 좌표 = 그림 가운데 */
      transform: translate(-50%, -50%);
    }

    /* 과학기지: 좌표 = 구조물 바닥 가운데 */
    .pin[data-anchor="bottom"] {
      transform: translate(-50%, -100%);
    }

    /* 배 그림 크기 (가로 기준) */
    .pin.ship {
      width: clamp(64px, 11cqw, 120px);
    }
    /* 크게 표시할 배 (data-size="large") */
    .pin.ship[data-size="large"] {
      width: clamp(88px, 16cqw, 176px);
    }
    /* 가고시마마루는 그림 비율이 달라 폭을 조금 줄여 비슷한 크기로 맞춤 */
    .pin.ship[data-img="kagoshima"][data-size="large"] {
      width: clamp(78px, 14.2cqw, 156px);
    }
    /* 아라온호 그림은 빙하·빔이 포함되어 있어 더 크게 */
    .pin.ship[data-img="araon"] {
      width: clamp(128px, 24cqw, 260px);
    }
    .pin.ship > img.main {
      width: 100%;
      height: auto;
    }

    /* 과학기지 그림 크기 (세로 기준) */
    .pin.station > img.main {
      height: clamp(32px, 5.4cqw, 60px);
      width: auto;
    }

    .pin img {
      display: block;
      pointer-events: none;
      -webkit-user-drag: none;
      filter:
        drop-shadow(1px 0 0 rgba(255,255,255,0.9))
        drop-shadow(-1px 0 0 rgba(255,255,255,0.9))
        drop-shadow(0 1px 0 rgba(255,255,255,0.9))
        drop-shadow(0 -1px 0 rgba(255,255,255,0.9));
      transition: filter 0.2s, transform 0.2s;
    }

    /* 배와 같은 그룹으로 묶인 추가 그림 (배의 오른쪽 아래) */
    .pin img.extra {
      position: absolute;
      left: 88%;
      top: 70%;
      width: 30%;
      pointer-events: auto;
      filter:
        drop-shadow(0.5px 0 0 rgba(255,255,255,0.9))
        drop-shadow(-0.5px 0 0 rgba(255,255,255,0.9))
        drop-shadow(0 0.5px 0 rgba(255,255,255,0.9))
        drop-shadow(0 -0.5px 0 rgba(255,255,255,0.9));
    }

    /* 마우스 오버 / 키보드 포커스: 외곽선을 따라 빨간 테두리 */
    .pin:hover,
    .pin:focus-visible,
    .pin.is-hover {
      z-index: 20;
    }

    .pin:hover img,
    .pin:focus-visible img,
    .pin.is-hover img {
      filter:
        drop-shadow(2px 0 0 #ff2d3d)
        drop-shadow(-2px 0 0 #ff2d3d)
        drop-shadow(0 2px 0 #ff2d3d)
        drop-shadow(0 -2px 0 #ff2d3d);
      transform: scale(1.12);
    }

    .pin[data-anchor="bottom"]:hover img.main,
    .pin[data-anchor="bottom"]:focus-visible img.main,
    .pin[data-anchor="bottom"].is-hover img.main {
      transform-origin: 50% 100%;
    }

    .pin:hover img.extra,
    .pin:focus-visible img.extra,
    .pin.is-hover img.extra {
      filter:
        drop-shadow(1px 0 0 #ff2d3d)
        drop-shadow(-1px 0 0 #ff2d3d)
        drop-shadow(0 1px 0 #ff2d3d)
        drop-shadow(0 -1px 0 #ff2d3d);
    }

  </style>
</head>

    // 위도/경도 → 지도 위 % 위치
    function place(pin) {
      const lat = parseFloat(pin.dataset.lat);
      let lon = parseFloat(pin.dataset.lon);
      if (isNaN(lat) || isNaN(lon)) return;
      if (lon < MAP.lonLeft) lon += 360;           // 서경(음수) 처리
      const x = (lon - MAP.lonLeft) / (MAP.lonRight - MAP.lonLeft) * 100;
      const y = (MAP.latTop - lat) / (MAP.latTop - MAP.latBottom) * 100;
      pin.style.left = x + '%';
      pin.style.top  = y + '%';
    }

    const pins = document.querySelectorAll('.pin');
    const mapBox = document.querySelector('.map-container');

    // 그림이 지도 경계를 벗어나면 안쪽으로 밀어 넣기 (여백 4px)
    function keepInside() {
      const box = mapBox.getBoundingClientRect();
      const pad = 4;
      pins.forEach(pin => {
        place(pin); // 원래 좌표로 되돌린 뒤 다시 계산
        let top = Infinity, bottom = -Infinity, left = Infinity, right = -Infinity;
        pin.querySelectorAll('img').forEach(img => {
          const r = img.getBoundingClientRect();
          top = Math.min(top, r.top); bottom = Math.max(bottom, r.bottom);
          left = Math.min(left, r.left); right = Math.max(right, r.right);
        });
        if (!isFinite(top)) return;
        let dy = 0, dx = 0;
        if (top < box.top + pad) dy = (box.top + pad) - top;                 // 북쪽 경계 → 남쪽으로
        else if (bottom > box.bottom - pad) dy = (box.bottom - pad) - bottom; // 남쪽 경계 → 북쪽으로
        if (left < box.left + pad) dx = (box.left + pad) - left;             // 서쪽 경계 → 동쪽으로
        else if (right > box.right - pad) dx = (box.right - pad) - right;    // 동쪽 경계 → 서쪽으로
        if (dy) {
          const curTop = parseFloat(pin.style.top) / 100 * box.height;
          pin.style.top = ((curTop + dy) / box.height * 100) + '%';
        }
        if (dx) {
          const curLeft = parseFloat(pin.style.left) / 100 * box.width;
          pin.style.left = ((curLeft + dx) / box.width * 100) + '%';
        }
      });
    }

    // 그룹: 대표 버튼(leader)이 있으면 툴팁·링크는 대표의 것을 사용
    function leaderOf(pin) {
      const g = pin.dataset.group;
      if (!g) return pin;
      return document.querySelector(`.pin[data-group="${g}"][data-group-leader]`) || pin;
    }
    function groupOf(pin) {
      const g = pin.dataset.group;
      return g ? document.querySelectorAll(`.pin[data-group="${g}"]`) : [pin];
    }

    function hasUrl(pin) {
      const url = pin.getAttribute('data-url');
      return url && url.trim() !== '' && !url.includes('YOUR_URL_HERE');
    }

    function openPin(pin) {
      const src = leaderOf(pin);
      if (hasUrl(src)) window.open(src.getAttribute('data-url'), '_blank');
    }

    pins.forEach(pin => {
      place(pin);

      // 그림 넣기
      const img = document.createElement('img');
      img.src = IMAGES[pin.dataset.img] || IMAGES.isabu;
      img.alt = '';
      img.className = 'main';
      pin.appendChild(img);

      // 같은 그룹으로 묶을 추가 그림
      if (pin.dataset.extra && IMAGES[pin.dataset.extra]) {
        const extra = document.createElement('img');
        extra.src = IMAGES[pin.dataset.extra];
        extra.alt = '';
        extra.className = 'extra';
        pin.appendChild(extra);
      }

      pin.addEventListener('click', () => openPin(pin));
      pin.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openPin(pin);
        }
      });

      // 그룹 전체 하이라이트
      pin.addEventListener('mouseenter', () => {
        groupOf(pin).forEach(p => p.classList.add('is-hover'));
      });


      pin.addEventListener('mouseleave', () => {
        groupOf(pin).forEach(p => p.classList.remove('is-hover'));
      });
    });

    // 그림이 모두 로드된 뒤, 그리고 창 크기가 바뀔 때 경계 확인
    const allImgs = Array.from(document.querySelectorAll('.map-container img'));
    Promise.all(allImgs.map(img => img.complete ? Promise.resolve()
      : new Promise(res => { img.onload = img.onerror = res; }))).then(keepInside);
    window.addEventListener('resize', keepInside);
  </script>

</body>
</html>
