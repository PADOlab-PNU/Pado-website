<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Notion 다크/라이트 모드 양쪽에서 iframe 배경이 투명하게 유지되도록 -->
  <meta name="color-scheme" content="light dark">
  <title>Interactive World Map - PADO Lab</title>
  <style>
    html, body {
      background: transparent;
    }

    body {
      font-family: 'Pretendard', -apple-system, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 16px;
    }

    h2 {
      margin: 0 0 15px;
      font-weight: 600;
      color: #0ea5e9; /* 라이트/다크 배경 모두에서 읽히는 하늘색 */
    }

    /* 1. Map Container */
    .map-container {
      position: relative;
      max-width: 1000px;
      width: 100%;
      container-type: inline-size; /* 지도 크기에 맞춰 배 크기 조절 */
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      border-radius: 12px;
      overflow: hidden;
      user-select: none;
    }

    .map-image {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 2. 배 그림 버튼 (좌표 = 배 그림의 가운데) */
    .pin {
      position: absolute;
      width: clamp(32px, 5.5cqw, 60px); /* 배 크기: 가운데 값(5.5cqw)을 바꾸면 조절됨 */
      cursor: pointer;
      transform: translate(-50%, -50%);
      z-index: 10;
      outline: none;
    }

    .pin img {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
      -webkit-user-drag: none;
      /* 평소: 지도 위에서 잘 보이도록 얇은 흰 테두리 */
      filter:
        drop-shadow(1px 0 0 rgba(255,255,255,0.9))
        drop-shadow(-1px 0 0 rgba(255,255,255,0.9))
        drop-shadow(0 1px 0 rgba(255,255,255,0.9))
        drop-shadow(0 -1px 0 rgba(255,255,255,0.9));
      transition: filter 0.2s, transform 0.2s;
    }

    /* 배와 같은 그룹으로 묶인 추가 그림 (배의 오른쪽 아래에 배치) */
    .pin img.extra {
      position: absolute;
      left: 88%;   /* 배 너비 기준 가로 위치 */
      top: 70%;    /* 배 높이 기준 세로 위치 */
      width: 30%;  /* 배 너비 대비 크기 */
      pointer-events: auto; /* 이 그림 위에 마우스를 올려도 버튼으로 인식 */
    }

    /* 마우스 오버 / 키보드 포커스: 배 외곽선을 따라 빨간 테두리 */
    .pin:hover,
    .pin:focus-visible {
      z-index: 20;
    }

    .pin:hover img,
    .pin:focus-visible img {
      filter:
        drop-shadow(2px 0 0 #ff2d3d)
        drop-shadow(-2px 0 0 #ff2d3d)
        drop-shadow(0 2px 0 #ff2d3d)
        drop-shadow(0 -2px 0 #ff2d3d);
      transform: scale(1.12);
    }

    /* 추가 그림(CPIES)은 작아서 테두리를 더 얇게 */
    .pin img.extra {
      filter:
        drop-shadow(0.5px 0 0 rgba(255,255,255,0.9))
        drop-shadow(-0.5px 0 0 rgba(255,255,255,0.9))
        drop-shadow(0 0.5px 0 rgba(255,255,255,0.9))
        drop-shadow(0 -0.5px 0 rgba(255,255,255,0.9));
    }

    .pin:hover img.extra,
    .pin:focus-visible img.extra {
      filter:
        drop-shadow(1px 0 0 #ff2d3d)
        drop-shadow(-1px 0 0 #ff2d3d)
        drop-shadow(0 1px 0 #ff2d3d)
        drop-shadow(0 -1px 0 #ff2d3d);
    }

    /* 3. Info Tooltip */
    #tooltip {
      position: fixed;
      display: none;
      background: rgba(15, 23, 42, 0.95);
      color: #ffffff;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      pointer-events: none;
      border: 1px solid #ff4757;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
      z-index: 1000;
      line-height: 1.6;
      max-width: 250px;
    }

    #tooltip strong {
      color: #ff4757;
      font-size: 15px;
      display: block;
      margin-bottom: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 4px;
    }

    .link-hint {
      display: block;
      margin-top: 6px;
      font-size: 11px;
      color: #38bdf8;
      font-weight: 500;
    }
  </style>
</head>

    const tooltip = document.getElementById('tooltip');
    const pins = document.querySelectorAll('.pin');

    function openPin(pin) {
      const url = pin.getAttribute('data-url');
      if (url && !url.includes('YOUR_URL_HERE')) {
        window.open(url, '_blank');
      }
    }

    pins.forEach(pin => {
      // 모든 버튼에 배 그림 넣기
      const img = document.createElement('img');
      img.src = pin.getAttribute('data-img') === 'araon' ? ARAON_IMG : SHIP_IMG;
      img.alt = '';
      pin.appendChild(img);

      // 같은 그룹으로 묶을 추가 그림 (마우스 오버·클릭이 배와 함께 동작)
      if (pin.getAttribute('data-extra') === 'cpies') {
        const extra = document.createElement('img');
        extra.src = CPIES_IMG;
        extra.alt = '';
        extra.className = 'extra';
        pin.appendChild(extra);
      }

      // 클릭 / Enter 키로 새 탭 열기
      pin.addEventListener('click', () => openPin(pin));
      pin.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openPin(pin);
        }
      });

      // 마우스 오버 시 툴팁
      pin.addEventListener('mousemove', (e) => {
        const title = pin.getAttribute('data-title');
        const info = pin.getAttribute('data-info');
        const url = pin.getAttribute('data-url');
        const pos = pin.getAttribute('data-pos') || 'bottom-left';

        let hintHtml = '';
        if (url && !url.includes('YOUR_URL_HERE')) {
          hintHtml = `<span class="link-hint">🔗 Click to open document</span>`;
        }

        tooltip.innerHTML = `<strong>${title}</strong>${info}${hintHtml}`;
        tooltip.style.display = 'block';

        if (pos === 'top-right') {
          tooltip.style.left = (e.clientX + 15) + 'px';
          tooltip.style.top = (e.clientY - 15) + 'px';
          tooltip.style.transform = 'translateY(-100%)';
        } else if (pos === 'bottom-right') {
          tooltip.style.left = (e.clientX + 15) + 'px';
          tooltip.style.top = (e.clientY + 15) + 'px';
          tooltip.style.transform = 'none';
        } else {
          tooltip.style.left = (e.clientX - 15) + 'px';
          tooltip.style.top = (e.clientY + 15) + 'px';
          tooltip.style.transform = 'translateX(-100%)';
        }
      });

      pin.addEventListener('mouseleave', () => {
        tooltip.style.display = 'none';
      });
    });
  </script>
